# Logging subsystem
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y  # Log to RAM buffer
CONFIG_LOG_BUFFER_SIZE=4096
CONFIG_LOG_PROCESS_THREAD=n # Turn off log kernel thread

# USB CDC ACM - virtual serial port
CONFIG_USB_DEVICE_STACK=y

# Turn off the new USB stack
CONFIG_USB_DEVICE_STACK_NEXT=n
CONFIG_USBD_CDC_ACM_CLASS=n
CONFIG_USB_CDC_ACM_RINGBUF_SIZE=4096

# Device init logging
CONFIG_SENSOR_LOG_LEVEL_DBG=n
CONFIG_I2C_LOG_LEVEL_DBG=n

# Devices
CONFIG_I2C=y
CONFIG_SENSOR=y
CONFIG_SERIAL=y
CONFIG_UART_LINE_CTRL=y
CONFIG_LSM6DSL=y
CONFIG_LSM6DSL_TRIGGER_OWN_THREAD=y # Data-ready interrupt on irq-gpios

# Other
CONFIG_CBPRINTF_FP_SUPPORT=y

# Hardware FPU, threads using it need K_FP_REGS
CONFIG_FPU=y
CONFIG_FPU_SHARING=y

# Bluetooth setup below
CONFIG_BT=y
CONFIG_BT_MAX_CONN=1
CONFIG_BT_MAX_PAIRED=2
CONFIG_BT_ATT_TX_COUNT=5
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="IMU Sandbox"
CONFIG_BT_DEVICE_APPEARANCE=962
CONFIG_BT_L2CAP_TX_MTU=64
CONFIG_BT_BUF_ACL_TX_SIZE=70
CONFIG_BT_BUF_ACL_RX_SIZE=70

CONFIG_NCS_SAMPLES_DEFAULTS=y

# Disable automatic initiation of PHY updates and the SMP Security Requests.
# Workaround to prevent disconnection with the following disconnect reasons:
# - 0x08 (BT_HCI_ERR_CONN_TIMEOUT)
# - 0x13 (BT_HCI_ERR_REMOTE_USER_TERM_CONN)
# - 0x23 (BT_HCI_ERR_LL_PROC_COLLISION)
# - 0x2A (BT_HCI_ERR_DIFF_TRANS_COLLISION)
# Some laptop Bluetooth controllers may simultaneously trigger two Link Layer
# procedures which results in a procedure collision and disconnection.
CONFIG_BT_GATT_AUTO_SEC_REQ=n
CONFIG_BT_AUTO_PHY_UPDATE=n

CONFIG_BT_BAS=y
CONFIG_BT_HIDS=y
CONFIG_BT_HIDS_INPUT_REP_MAX=3
CONFIG_BT_HIDS_OUTPUT_REP_MAX=0
CONFIG_BT_HIDS_FEATURE_REP_MAX=0
CONFIG_BT_HIDS_ATTR_MAX=24
CONFIG_BT_HIDS_MAX_CLIENT_COUNT=1
CONFIG_BT_HIDS_DEFAULT_PERM_RW_ENCRYPT=y
CONFIG_BT_GATT_UUID16_POOL_SIZE=40
CONFIG_BT_GATT_CHRC_POOL_SIZE=20

CONFIG_BT_CONN_CTX=y

CONFIG_BT_DIS=y
CONFIG_BT_DIS_MANUF_NAME=y
CONFIG_BT_DIS_MANUF_NAME_STR="NordicSemiconductor"
CONFIG_BT_DIS_PNP=y
CONFIG_BT_DIS_PNP_VID_SRC=2
CONFIG_BT_DIS_PNP_VID=0x1915
CONFIG_BT_DIS_PNP_PID=0xEEEE
CONFIG_BT_DIS_PNP_VER=0x0100

# Increase BT TX processor thread stack size to prevent stack overflow when performing directed
# advertising. On nRF52840 the maximum measured stack usage is 780 bytes. On nRF54L15 the maximum
# measured stack usage is 856 bytes.
CONFIG_BT_TX_PROCESSOR_STACK_SIZE=1024

CONFIG_MAIN_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

# Delay the GATT/ATT "sent" callback until the controller has actually transmitted the PDU,
# instead of firing it as soon as the buffer is handed to L2CAP/HCI.
# The movement in-flight limit in hids_mouse.c relies on this.
CONFIG_BT_ATT_SENT_CB_AFTER_TX=y
