# Logging subsystem
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y  # Log to RAM buffer
CONFIG_LOG_BUFFER_SIZE=4096
CONFIG_LOG_PROCESS_THREAD=n # Turn off log kernel thread

# USB CDC ACM - virtual serial port
CONFIG_USB_DEVICE_STACK=y

# Turn off the new USB stack
CONFIG_USB_DEVICE_STACK_NEXT=n
CONFIG_USBD_CDC_ACM_CLASS=n
CONFIG_USB_CDC_ACM_RINGBUF_SIZE=4096

# Device init logging
CONFIG_SENSOR_LOG_LEVEL_DBG=y
CONFIG_I2C_LOG_LEVEL_DBG=y

# Devices
CONFIG_I2C=y
CONFIG_SENSOR=y
CONFIG_SERIAL=y
CONFIG_UART_LINE_CTRL=y
CONFIG_LSM6DSL=y
CONFIG_LSM6DSL_TRIGGER_OWN_THREAD=y # Data-ready interrupt on irq-gpios

# Other
CONFIG_CBPRINTF_FP_SUPPORT=y

# Hardware FPU, threads using it need K_FP_REGS
CONFIG_FPU=y
CONFIG_FPU_SHARING=y